[project]
name = "geluidsman"
version = "1.0.0"
description = "A shared Discord soundboard with a video library and waveform editor."
authors = []
requires-python = ">=3.11,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
"discord.py" = { version = "2.7.1", extras = ["voice"] }
discord-ext-voice-recv-dave = {git = "https://github.com/jstewart0788/discord-ext-voice-recv-dave.git", rev = "78fcb434a3484f2abf54cf89e80e86b651e5c28d"}
fastapi = ">=0.115,<1"
uvicorn = ">=0.34,<1"
pydantic-settings = ">=2.7,<3"
numpy = ">=2.2,<3"
yt-dlp = { version = ">=2026.9.23", extras = ["default"], allow-prereleases = true }
requests = ">=2.32,<3"
cryptography = ">=46,<47"
psycopg = {version = ">=3.2,<4", extras = ["binary"]}

[tool.poetry.group.worker.dependencies]
tokenizers = {version = ">=0.21,<0.23", python = ">=3.11,<3.14"}
huggingface-hub = {version = ">=0.34,<1", python = ">=3.11,<3.14"}
faster-whisper = {version = ">=1.2,<2", python = ">=3.11,<3.14"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
httpx = ">=0.28,<1"
ruff = "==0.16.10"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "CPY001", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001"]
"app/config.py" = ["S104"]
"app/transcription_worker.py" = ["S104"]
"app/network.py" = ["N815"]
"app/mixer.py" = ["SIM115"]
"app/download_worker.py" = ["SLF001"]
"app/auth.py" = ["SLF001"]
"app/db.py" = ["PLR0913"]
"app/accounts.py" = ["PLR0913"]
"tests/browser_fixture.py" = ["S603"]
"tests/test_api.py" = ["S101", "PLR2004", "SLF001", "S603"]
"tests/test_uploads.py" = ["S603"]
"tests/test_network.py" = ["S101", "PLR2004", "SLF001", "S104"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

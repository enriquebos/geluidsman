name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: geluidsman
          POSTGRES_PASSWORD: fixture_password
          POSTGRES_DB: geluidsman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geluidsman -d geluidsman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://geluidsman:fixture_password@127.0.0.1:5432/geluidsman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libopus0
      - name: Install Poetry
        run: pip install poetry
      - uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
      - name: Install locked dependencies
        run: |
          poetry install --only main,dev --no-interaction
          npm ci --prefix frontend
      - name: Verify media dependencies
        run: |
          deno --version
          ffmpeg -version
          ffprobe -version
      - name: Validate Python project
        run: |
          poetry check --lock
          poetry run ruff check app tests
          poetry run ruff format --check app tests
          poetry run pytest
      - name: Build dashboard
        run: npm run build --prefix frontend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: npm test --prefix frontend
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
